name: Update data and deploy

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close, Monday to Friday
  workflow_dispatch:
    inputs:
      fund_batch:
        description: "Companies whose fundamentals are refreshed this run"
        default: "120"
  push:
    branches: [main]
    paths-ignore: ["data/archive/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opsilon-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keep the previous run's data and the fundamentals cache, so a failing
      # source leaves yesterday's figures in place instead of an empty page.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data
            data/cache
          key: opsilon-data-${{ github.run_id }}
          restore-keys: opsilon-data-

      - name: Run the data pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FUND_BATCH: ${{ github.event.inputs.fund_batch || '120' }}
        run: python pipeline/run.py

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            site/data
            data/cache
          key: opsilon-data-${{ github.run_id }}

      - name: Build the site
        run: python build_site.py

      - name: Commit the notes archive
        run: |
          git config user.name "opsilon-bot"
          git config user.email "opsilon-bot@users.noreply.github.com"
          git add data/archive
          if ! git diff --cached --quiet; then
            git commit -m "Notes for $(date -u +%F) [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
