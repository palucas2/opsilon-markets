name: Telegram alerts (EIA, COT, tier-1)

on:
  schedule:
    - cron: "*/15 12-21 * * 1-5"   # every 15 minutes, 07:00-17:00 New York in winter (08:00-18:00 in summer)
  workflow_dispatch:

concurrency:
  group: opsilon-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore store and alert state
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: opsilon-alerts-${{ github.run_id }}
          restore-keys: |
            opsilon-alerts-
            opsilon-data-
      - name: Send what is due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "No TELEGRAM_BOT_TOKEN secret: nothing to do"; exit 0; fi
          python tools/telegram_alerts.py
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: opsilon-alerts-${{ github.run_id }}
